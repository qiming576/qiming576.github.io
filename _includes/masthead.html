<header class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Main navigation">
        <a class="home-link" href="#about-me">Homepage</a>
        <button class="menu-toggle" type="button" aria-controls="primary-navigation" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>Menu</button>
        <ul class="visible-links" id="primary-navigation">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me">Homepage</a></li>
          {% for link in site.data.navigation.main %}
            {% assign nav_url = link.url %}{% if nav_url contains '/#' %}{% assign nav_url = nav_url | remove_first: '/' %}{% endif %}
            <li class="masthead__menu-item"><a href="{{ nav_url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </div>
</header>
